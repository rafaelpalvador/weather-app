<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Céu</title>
<meta name="theme-color" content="#1d5bb8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e13;--s1:#13161d;--s2:#1a1e27;--line:rgba(255,255,255,.07);
  --txt:#f2f4f7;--dim:#8f97a5;--faint:#5c6472;--acc:#8ab8ff;--rain:#6fb6ff;--sun:#ffc24b;
  --glow:#2f6fe0;--r:20px;
}
body[data-sky=clear-day]{--glow:#2c6be0}
body[data-sky=clear-night]{--glow:#2b2f72}
body[data-sky=partly-day]{--glow:#3563ad}
body[data-sky=partly-night]{--glow:#272c5c}
body[data-sky^=cloudy]{--glow:#3a4454}
body[data-sky^=rain]{--glow:#22496e}
body[data-sky^=storm]{--glow:#4a3880}
body[data-sky^=snow]{--glow:#6c86aa}
body[data-sky^=fog]{--glow:#4a525f}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:transparent;min-height:100vh;
  font-feature-settings:"tnum" 1,"cv11" 1;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
body.land .hero{min-height:calc(70vh - 70px)!important}
body.land .shade{background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,.04) 24%,rgba(0,0,0,0) 45%,rgba(0,0,0,0) 66%,rgba(12,14,19,.6) 82%,rgba(12,14,19,.88) 100%)!important}
body.land.glass .shade{background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 68%,rgba(6,8,14,.35) 100%)!important}
.shade{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.22) 0%,rgba(0,0,0,.06) 22%,rgba(0,0,0,.1) 40%,rgba(12,14,19,.55) 68%,rgba(12,14,19,.88) 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.wi{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 32px)}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ib:active{transform:scale(.94)}
.ttl{text-align:center;min-width:0;cursor:pointer}
.city{font-size:22px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.city svg{width:13px;height:13px;margin-right:5px;vertical-align:1px;opacity:.85}
.sub{font-size:12px;color:rgba(255,255,255,.72);min-height:16px;display:flex;justify-content:center;align-items:center;gap:6px;margin-top:2px}
.sub.loading::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.hero{min-height:calc(58vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 0 18px;
  text-shadow:0 2px 28px rgba(0,0,0,.35)}
.h-temp{font-size:132px;font-weight:200;line-height:.95;letter-spacing:-.06em;margin-left:.12em}
.h-temp sup{font-size:.42em;font-weight:200;vertical-align:top;position:relative;top:.18em;margin-left:2px}
.h-hl{font-size:16px;margin-top:10px;color:rgba(255,255,255,.92)}
.h-cond{font-size:16px;margin-top:6px;display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.92)}
.h-cond .wi{width:20px;height:20px}
.h-cond i{width:1px;height:12px;background:rgba(255,255,255,.35)}
.h-sum{margin-top:18px;font-size:13.5px;line-height:1.4;padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.14);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-shadow:none;max-width:92%}
.h-sum.wet{background:rgba(111,182,255,.22)}
.h-src{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:10px;text-shadow:none}
.h-src b{font-weight:500;color:rgba(255,255,255,.8)}

.warn{margin-top:12px;border-radius:18px;padding:12px 14px;background:rgba(60,48,18,.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;gap:12px}
.warn i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:#ffcc33}
.warn.orange{background:rgba(255,128,0,.1)}.warn.orange i{background:#ff8a1f}
.warn.red{background:rgba(255,60,60,.12)}.warn.red i{background:#ff4b4b}
.warn b{display:block;font-size:14px;font-weight:600}
.warn{display:block}
.warn summary{list-style:none;display:flex;gap:12px;cursor:pointer}
.warn summary::-webkit-details-marker{display:none}
.warn[open] summary p{display:none}
.wg{display:flex;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.wg .wd{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:#ffcc33}
.wg .wd.orange{background:#ff8a1f}.wg .wd.red{background:#ff4b4b}
.wg p{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.4}
.wg .wp{color:var(--txt);font-weight:500}
.warn p{font-size:13px;color:var(--dim);margin-top:2px;line-height:1.4}

.blk{background:rgba(19,22,30,.66);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:var(--r);padding:16px;margin-top:12px}
.blk h2{font-size:13px;font-weight:500;color:var(--dim);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.blk h2 span{margin-left:auto;font-weight:400;color:var(--faint);font-size:12px}

/* horas */
.hs{overflow-x:auto;margin:0 -16px;padding:0 10px;scrollbar-width:none;display:flex}
.hs::-webkit-scrollbar{display:none}
.hc{flex:none;width:52px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.hc .t{font-size:12px;color:var(--dim)}
.hc.now .t,.hc.d0 .t{color:var(--txt);font-weight:600}
.hc .wi{width:22px;height:22px}
.hc .v{font-size:15px;font-weight:500}
.hc .p{font-size:11px;color:var(--rain);min-height:13px}

/* chuva 2 h */
.nb{display:flex;align-items:flex-end;gap:4px;height:40px}
.nb i{flex:1;border-radius:3px;background:var(--rain);min-height:2px}
.nb i.z{background:var(--line)}
.na{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}

/* dias */
.day summary{list-style:none;display:grid;grid-template-columns:46px 24px 34px 28px 1fr 28px;align-items:center;gap:10px;padding:11px 0;cursor:pointer;border-top:1px solid var(--line)}
.day:first-of-type summary{border-top:0;padding-top:2px}
.day summary::-webkit-details-marker{display:none}
.dn{font-size:15px;font-weight:500}
.day .wi{width:22px;height:22px}
.dp{font-size:12px;color:var(--rain)}
.dmn{color:var(--faint);text-align:right;font-size:15px}
.dmx{text-align:right;font-size:15px;font-weight:500}
.bar{position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.08)}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.bar b{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #151922}
.dx{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;padding:4px 0 14px}
.dx div small{display:block;font-size:11.5px;color:var(--faint)}
.dx div span{font-size:13.5px}
.dx .full{grid-column:1/-1;font-size:13px;color:var(--dim)}

/* condições */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin:0 -2px}
.st{background:var(--s1);padding:14px 12px 14px 2px;display:flex;flex-direction:column;gap:3px}
.st:nth-child(even){padding-left:14px}
.st small{font-size:12px;color:var(--faint)}
.st b{font-size:22px;font-weight:400;letter-spacing:-.02em;display:flex;align-items:baseline;gap:3px}
.st b em{font-style:normal;font-size:13px;color:var(--dim);font-weight:400}
.st span{font-size:12.5px;color:var(--dim)}
.st .arw{width:16px;height:16px;color:var(--dim);align-self:center;margin-right:4px}
.meter{height:3px;border-radius:3px;background:var(--s2);margin-top:6px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px}


#heroTxt{display:flex;flex-direction:column;align-items:center;width:100%;transition:opacity .25s,transform .25s}
#heroTxt.out{opacity:0;transform:translateX(var(--dx,0))}
.dots{display:flex;justify-content:center;align-items:center;gap:6px;height:12px;margin-top:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
.dots svg{width:9px;height:9px;fill:rgba(255,255,255,.45)}
.dots svg.on{fill:#fff}
.set-sec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:22px 2px 8px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;font-size:14.5px}
.set-row small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.seg{display:inline-flex;background:var(--s2);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{font-size:12.5px;padding:6px 10px;border-radius:8px;color:var(--dim)}
.seg button.on{background:var(--txt);color:var(--bg);font-weight:500}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.chips2 button{font-size:12.5px;padding:7px 12px;border-radius:99px;background:var(--s2);color:var(--faint);border:1px solid transparent}
.chips2 button.on{color:var(--txt);border-color:rgba(255,255,255,.25)}
.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:12px;background:var(--s2);font-size:14px;margin-top:8px}
.btn.danger{color:#ff8a8a}
.sel{font:inherit;font-size:13.5px;color:var(--txt);background:var(--s2);border:0;border-radius:10px;padding:8px 10px;max-width:55%}
.item .tp{font-size:20px;font-weight:300;min-width:44px;text-align:right}
.item .wi{width:22px;height:22px;color:var(--dim)}
.item.cur{background:rgba(138,184,255,.08);border-radius:12px;padding-left:8px;padding-right:8px}
.item .x,.item .up{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint);font-size:14px}


/* ===== Liquid Glass ===== */
body.glass{--dim:rgba(255,255,255,.78);--faint:rgba(255,255,255,.56);--line:rgba(255,255,255,.14)}
body.glass .shade{background:linear-gradient(180deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,.04) 55%,rgba(6,8,14,.32) 100%)}
body.glass .blk,body.glass .cd,body.glass .warn{
  background:linear-gradient(140deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.06) 42%,rgba(255,255,255,.09) 100%),rgba(14,20,36,.16);
  text-shadow:0 1px 2px rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);
  border:1px solid rgba(255,255,255,.2);border-radius:28px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 1px 0 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.06),0 12px 34px rgba(0,0,0,.2)}
body.glass .blk::before,body.glass .cd::before,body.glass .warn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:radial-gradient(110% 55% at 8% -12%,rgba(255,255,255,.24),transparent 55%),radial-gradient(70% 40% at 100% 115%,rgba(255,255,255,.09),transparent 60%)}
body.glass .blk>*,body.glass .cd>*,body.glass .warn>*{position:relative;z-index:1}
body.glass .warn.yellow,body.glass .warn{background:linear-gradient(140deg,rgba(255,214,90,.26),rgba(255,190,40,.1))}
body.glass .warn.orange{background:linear-gradient(140deg,rgba(255,150,60,.32),rgba(255,120,20,.12))}
body.glass .warn.red{background:linear-gradient(140deg,rgba(255,90,90,.36),rgba(255,40,40,.14))}
body.glass .ib,body.glass .h-sum,body.glass .tabs button,body.glass .toast{
  background:linear-gradient(140deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(8px) saturate(180%);backdrop-filter:blur(8px) saturate(180%);
  backdrop-filter:url(#lgr) blur(6px) saturate(180%)}
body.glass .h-sum.wet{background:linear-gradient(140deg,rgba(140,200,255,.34),rgba(111,182,255,.12))}
body.glass .tabs button.on{background:rgba(255,255,255,.9);color:#141821}
body.glass .bar,body.glass .sc{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
body.glass .bar{background:rgba(255,255,255,.14)}
body.glass .bar b,body.glass .sc b{box-shadow:0 0 0 3px rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.3)}
body.glass .day summary{border-top-color:rgba(255,255,255,.12)}
body.glass .nb i.z{background:rgba(255,255,255,.14)}
body.glass .mapph,body.glass .map{background:rgba(255,255,255,.08)}
body.glass .sheet .bd{background:rgba(0,0,0,.25)}
body.glass .sheet .pn{background:linear-gradient(160deg,rgba(60,66,84,.55),rgba(24,28,38,.62));
  -webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);
  border:1px solid rgba(255,255,255,.18);border-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
body.glass .inp,body.glass .seg,body.glass .opt,body.glass .btn,body.glass .sel,body.glass .chips2 button,body.glass .grab{background:rgba(255,255,255,.12)}
body.glass .seg button.on{background:rgba(255,255,255,.92);color:#141821}
body.glass .item{border-bottom-color:rgba(255,255,255,.12)}
body.glass .h-temp{text-shadow:0 2px 30px rgba(0,0,0,.25)}


/* topo: temperatura no canto (estilo Samsung) */
.h-a,.h-b{display:flex;flex-direction:column;align-items:center}
.h-hl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.h-hl i{width:1px;height:12px;background:rgba(255,255,255,.4)}
.hero{text-shadow:0 1px 3px rgba(0,0,0,.28),0 2px 22px rgba(0,0,0,.3)!important}
body.corner .top{display:flex;gap:8px}
body.corner .ttl{order:-1;flex:1;text-align:left}
body.corner #cityBtn{order:1} body.corner #setBtn{order:2}
body.corner .city{font-size:21px}
body.corner .dots,body.corner .sub{justify-content:flex-start}
body.corner .dots{margin-left:22px}
body.corner .hero{align-items:stretch;text-align:left;justify-content:flex-start;padding-top:18px}
body.corner #heroTxt{align-items:stretch;justify-content:space-between;min-height:calc(58vh - 110px)}
body.corner.land #heroTxt{min-height:calc(78vh - 120px)}
body.corner .h-a,body.corner .h-b{align-items:flex-start}
body.corner .h-temp{font-size:124px;margin-left:-8px}
body.corner .h-cond{font-size:22px;font-weight:500;margin-top:6px}
body.corner .h-cond .wi{width:24px;height:24px}
body.corner .h-hl{justify-content:flex-start;font-size:16px;font-weight:500}
body.corner .h-sum{margin-top:12px}
body.land .hero{min-height:calc(78vh - 70px)!important}
body.land .shade{background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 74%,rgba(12,14,19,.55) 86%,rgba(12,14,19,.88) 100%)!important}
body.land.glass .shade{background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 76%,rgba(6,8,14,.35) 100%)!important}

/* cartões */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.cd{background:rgba(19,22,30,.66);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:var(--r);padding:14px 14px 16px;display:flex;flex-direction:column;min-height:176px;min-width:0}
.cd.wide{grid-column:1/-1;min-height:0}
.cl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);margin-bottom:10px}
.cv{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.cv.big{font-size:36px;font-weight:400}
.cv span{font-size:15px;color:var(--dim);margin-left:3px;font-weight:400}
.cs{font-size:13px;color:var(--txt);margin-top:4px}
.cs em{font-style:normal;color:var(--faint)}
.cd p{font-size:12.5px;color:var(--dim);line-height:1.4;margin-top:auto;padding-top:10px}
.sc{position:relative;height:4px;border-radius:4px;margin:14px 0 2px}
.sc b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #151922}
.lh{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:12px}
.lh+.sc{margin-top:6px}
.comp{width:104px;height:104px;margin:-2px auto 0;display:block}
.suncv{width:100%;height:auto;margin-top:8px}
.gau{width:112px;height:auto;margin:-4px auto 0;display:block}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{font-size:12.5px;padding:6px 12px;border-radius:99px;background:var(--s2);color:var(--dim);flex:none}
.tabs button.on{background:var(--txt);color:var(--bg)}
.map{width:100%;height:300px;border:0;border-radius:14px;background:var(--s2);display:block}
.mapph{height:160px;border-radius:14px;background:var(--s2);display:grid;place-items:center;text-align:center;font-size:12.5px;color:var(--faint);padding:20px;line-height:1.5}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;margin-top:4px}
.act{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;color:var(--dim)}
.act span{font-size:12px;line-height:1.35;color:var(--txt)}
.act span i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.pl{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px}
.pl div{display:flex;justify-content:space-between}
.pl b{font-weight:500}
.lv0{color:#9fe8b8}.lv1{color:#5ee67a}.lv2{color:#ffe14d}.lv3{color:#ff9a3c}.lv4{color:#ff5e5e}
.moon{display:flex;align-items:center;justify-content:space-between;gap:12px}
.moon p{padding-top:8px}


footer{font-size:11px;color:var(--faint);text-align:center;line-height:1.6;margin-top:28px;padding:0 12px}

.sk{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.3s infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}

/* painéis */
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--s1);border-radius:24px 24px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .22s ease-out;max-width:520px;margin:0 auto}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:36px;height:4px;border-radius:4px;background:var(--s2);margin:0 auto 16px}
.sheet h3{font-size:17px;font-weight:600;margin-bottom:14px}
.inp{width:100%;font:inherit;font-size:16px;color:var(--txt);background:var(--s2);border:0;border-radius:14px;padding:13px 14px;outline:none}
.inp::placeholder{color:var(--faint)}
.list{margin-top:8px}
.item{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:500;font-size:15px}
.item .nm small{color:var(--faint);font-size:12.5px}
.item button.x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.item.loc b{color:var(--acc)}
.sec{font-size:12px;color:var(--faint);margin:18px 0 0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--s2);margin-top:8px;cursor:pointer;border:1px solid transparent}
.opt.sel{border-color:var(--acc)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:1px}
.opt.sel .rd{border:5px solid var(--acc)}
.opt b{display:block;font-size:15px;font-weight:500}
.opt small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4;margin-top:3px}
.favb{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border-radius:14px;background:var(--s2);margin-top:6px;font-size:15px}
.favb svg{color:var(--sun)}
.favb.on svg{fill:var(--sun)}
.sheet p.txt{font-size:13px;color:var(--dim);line-height:1.5;margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(16px);opacity:0;
  background:var(--s2);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:30;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ptr{position:fixed;top:calc(env(safe-area-inset-top) - 40px);left:50%;margin-left:-18px;width:36px;height:36px;border-radius:50%;background:var(--s2);
  display:grid;place-items:center;z-index:10;transition:transform .15s,opacity .15s;opacity:0;color:var(--dim)}
.ptr.ready svg{transform:rotate(180deg)}
.ptr svg{transition:transform .2s}
.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>

async function getPosition(){
  if(TAURI){
    try{
      let perm = await TAURI.invoke("plugin:geolocation|check_permissions");

      if(perm.location === "granted")

    if(!navigator.geolocation) return rej(new Error("sem GPS"));

async function reverseGeocode(lat, lon){

    const j = await fetchJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`, 8000);
    const name = j.city || j.locality || j.principalSubdivision;
    if(name) return { name, region: j.principalSubdivision && j.principalSubdivision !== name ? j.principalSubdivision : (j.countryName || ""), cc: j.countryCode || "" };
  }catch(e){}
  const j = await fetchJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=10&accept-language=pt`, 8000);
  const a = j.address || {};
  return { name: a.city || a.town || a.village || a.municipality || a.county || j.name || "Local atual", region: a.state || a.region || a.country || "", cc: (a.country_code || "").toUpperCase() };

  const j = await fetchJSON("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=pt", 8000);
  if(!isNum(j.latitude)) throw new Error("sem IP");
  return { lat: j.latitude, lon: j.longitude, name: j.city || j.locality || "Local aproximado", region: j.principalSubdivision || j.countryName || "", cc: j.countryCode || "", auto: true, approx: true };

function fcURL(p, model){

    current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m",

    daily: "weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,daylight_duration,uv_index_max,precipitation_sum,precipitation_hours,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant",
    minutely_15: "precipitation", forecast_minutely_15: 16

async function fetchForecast(p){

    try{ return { fc: await fetchJSON(fcURL(p, id)), used: src.id }; }catch(e){ if(src.id === "auto") throw e; }

}
async function fetchAQ(p){
  const q = new URLSearchParams({ latitude: p.lat.toFixed(4), longitude: p.lon.toFixed(4), timezone: "auto", forecast_days: 2,
    current: "european_aqi,pm2_5,pm10,nitrogen_dioxide,ozone",
    hourly: "alder_pollen,birch_pollen,grass_pollen,olive_pollen,mugwort_pollen,ragweed_pollen" });

function inPortugal(p){ return p.cc ? p.cc === "PT" : (p.lat > 32 && p.lat < 42.3 && p.lon > -31.5 && p.lon < -6.1); }
async function fetchWarnings(p){
  if(!inPortugal(p)) return null;
  let d = store.get("ceu.ipmaD");
  if(!d || Date.now() - d.ts > 7 * 864e5){
    const j = await fetchJSON("https://api.ipma.pt/open-data/distrits-islands.json");
    d = { ts: Date.now(), list: (j.data || []).map(x => ({ id: x.idAreaAviso, name: x.local, lat: +x.latitude, lon: +x.longitude })) };
    store.set("ceu.ipmaD", d);
  }
  let best = null, bd = 1e9;
  d.list.forEach(x => { const k = dist(p.lat, p.lon, x.lat, x.lon); if(k < bd){ bd = k; best = x; } });
  if(!best || bd > 150) return null;
  const w = await fetchJSON("https://api.ipma.pt/open-data/forecast/warnings/warnings_www.json");
  const arr = Array.isArray(w) ? w : (w.data || []);
  const now = Date.now(), rank = { red: 3, orange: 2, yellow: 1 };
  const list = arr.filter(x => x.idAreaAviso === best.id && rank[x.awarenessLevelID] && new Date(x.endTime).getTime() > now)
                  .sort((a, b) => rank[b.awarenessLevelID] - rank[a.awarenessLevelID]);

}

async function load(place, force){
  const my = ++state.req;
  state.place = place; renderHeader();
  const k = pkey(place), c = state.pc[k];
  if(c){ state.data = c; renderAll(); }
  const maxAge = Math.max(5, cfg.sync || 15) * 60000;
  if(c && !force && Date.now() - c.ts < maxAge){ renderSub(); return; }
  setSub("A atualizar…", true);
  try{
    const { fc, used } = await fetchForecast(place);
    if(my !== state.req) return;
    const d = { fc, used, aq: c ? c.aq : null, warn: c ? c.warn : null, ts: Date.now() };
    state.data = d; state.pc[k] = d; renderAll();
    if(place.auto) saveWidget();
    const [aq, warn] = await Promise.allSettled([fetchAQ(place), fetchWarnings(place)]);
    d.aq = aq.status === "fulfilled" ? aq.value : d.aq;
    d.warn = warn.status === "fulfilled" ? warn.value : null;
    if(my !== state.req) return;
    renderAll();
    store.set("ceu.cache", { place, data: d });
    store.set("ceu.lastSync", Date.now());
  }catch(e){

function summary(fc, idx){

    if(wet(cur.precipitation) || wet(nc[0].v)){
      const stop = nc.findIndex(x => !wet(x.v));
      return { wet: true, t: stop < 0 ? "Chuva contínua nas próximas 2 horas." : `A chuva deve parar por volta das ${hhmm(nc[stop].t)}.` };
    }
    const start = nc.findIndex(x => wet(x.v));
    if(start >= 0) return { wet: true, t: `Chuva a partir das ${hhmm(nc[start].t)}.` };
  }
  for(let i = idx + 1; i < Math.min(idx + 13, H.time.length); i++){
    const pp = H.precipitation_probability[i];
    if((pp ?? 0) >= 50 || (H.precipitation[i] ?? 0) >= 0.3)
      return { wet: true, t: isNum(pp) ? `Chuva provável a partir das ${hh(H.time[i])} (${pp}%).` : `Chuva prevista a partir das ${hh(H.time[i])}.` };
  }
  let peak = idx; for(let i = idx; i < Math.min(idx + 12, H.time.length); i++) if(H.temperature_2m[i] > H.temperature_2m[peak]) peak = i;
  const gust = Math.max(...H.wind_gusts_10m.slice(idx, idx + 12).filter(isNum));
  let s = "Sem chuva nas próximas 12 horas.";
  if(gust >= 50) s += ` Rajadas até ${WS(gust)} ${WU()}.`;

}

function moonInfo(d = new Date()){
  const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  const age = (((d - ref) / 864e5) % syn + syn) % syn, th = 2 * Math.PI * age / syn;
  const illum = (1 - Math.cos(th)) / 2;
  const N = ["Lua nova","Lua crescente","Quarto crescente","Crescente gibosa","Lua cheia","Minguante gibosa","Quarto minguante","Lua minguante"];
  const name = N[Math.floor(((age / syn) * 8 + .5)) % 8];
  const addD = n => { const x = new Date(d.getTime() + n * 864e5); return `${x.getDate()} ${MON[x.getMonth()]}`; };
  const toFull = ((syn / 2 - age) + syn) % syn, toNew = syn - age;
  return { age, th, illum, name, nextFull: addD(toFull), nextNew: addD(toNew), toFull, toNew };
}

function activities(fc, idx, aqv){
  const H = fc.hourly, D = fc.daily, c = fc.current;
  const rng = (a, b) => { const o = []; for(let i = idx + a; i < Math.min(idx + b, H.time.length); i++) o.push(i); return o; };
  const mx = (k, a, b) => Math.max(...rng(a, b).map(i => H[k][i]).filter(isNum));
  const sum = (k, a, b) => rng(a, b).reduce((s, i) => s + (H[k][i] || 0), 0);
  const ppNext = (h) => mx("precipitation_probability", 0, h);
  const at = c.apparent_temperature, t = c.temperature_2m, w = c.wind_speed_10m, g = c.wind_gusts_10m;
  const sportScore = (i, windLim) => {
    const T = H.apparent_temperature[i], P = H.precipitation_probability[i] ?? 0, W = H.wind_speed_10m[i], day = H.is_day[i];
    let s = 2; if(P >= 60 || (H.precipitation[i] || 0) >= .5 || T < 0 || T > 32 || W > windLim * 1.6) s = 0; else if(P >= 30 || T < 5 || T > 26 || W > windLim) s = 1;
    if(!day && s === 2) s = 1; return s;
  };
  const best = (windLim) => { let b = null; rng(0, 14).forEach(i => { if(!H.is_day[i]) return; const s = sportScore(i, windLim); if(b == null || s > b.s) b = { s, i }; }); return b; };
  const sport = (lbl, ic, windLim) => {
    const now = sportScore(idx, windLim), b = best(windLim);
    const txt = ["Mau para " + lbl, "Razoável para " + lbl, "Bom para " + lbl][now];
    const tip = b && b.s > now ? ` · melhor às ${hh(H.time[b.i])}` : (b && b.s === 2 && now === 2 ? "" : "");
    return { ic, lv: now, t: txt + tip };
  };
  const out = [];
  out.push(sport("correr", "run", 25));
  out.push(sport("pedalar", "bike", 18));
  const hikeLv = ppNext(6) >= 60 || g > 60 ? 0 : ppNext(6) >= 30 || g > 40 || (H.visibility[idx] ?? 1e5) < 3000 ? 1 : 2;
  out.push({ ic: "hike", lv: hikeLv, t: ["Desaconselhável para caminhadas", "Caminhadas com cuidado", "Bom para caminhadas"][hikeLv] });
  const pTrend = (H.pressure_msl[idx] ?? 0) - (H.pressure_msl[Math.max(0, idx - 3)] ?? 0);
  const fishLv = w > 30 || ppNext(4) >= 70 ? 0 : (w < 20 && pTrend <= .5) ? 2 : 1;
  out.push({ ic: "fish", lv: fishLv, t: ["Mau para pescar", "Razoável para pescar", "Bom para pescar"][fishLv] });
  const jt = at < 0 ? "Casaco grosso, gorro e luvas" : at < 8 ? "Casaco quente recomendado" : at < 15 ? "Casaco leve recomendado" : at < 21 ? "Camisola ou casaco fino" : at < 27 ? "Roupa leve" : "Roupa muito leve e fresca";
  out.push({ ic: "jacket", lv: -1, t: jt + (ppNext(8) >= 50 ? " e guarda-chuva" : "") });
  const dr = (D.temperature_2m_max[0] ?? t) - (D.temperature_2m_min[0] ?? t);
  const coldLv = (dr >= 12 || (at < 5 && c.relative_humidity_2m > 80)) ? 0 : (dr >= 8 || at < 8) ? 1 : 2;
  out.push({ ic: "cold", lv: coldLv, t: ["Risco elevado de constipação", "Risco moderado de constipação", "Risco baixo de constipação"][coldLv] });
  const jLv = (c.relative_humidity_2m > 85 && pTrend < -1) || (at < 3 && c.relative_humidity_2m > 80) ? 0 : (c.relative_humidity_2m > 80 || pTrend < -1.5 || at < 6) ? 1 : 2;
  out.push({ ic: "joint", lv: jLv, t: ["Probabilidade alta de dores articulares", "Probabilidade moderada de dores articulares", "Probabilidade baixa de dores articulares"][jLv] });
  const nightIdx = H.time.map((tm, i) => i).filter(i => i >= idx && i < idx + 30 && !H.is_day[i]).slice(0, 8);
  const ncl = nightIdx.length ? nightIdx.reduce((s, i) => s + H.cloud_cover[i], 0) / nightIdx.length : 100;
  const mi = moonInfo(); let stLv = ncl < 25 ? 2 : ncl < 55 ? 1 : 0; if(stLv === 2 && mi.illum > .75) stLv = 1;
  out.push({ ic: "stars", lv: stLv, t: ["Mau para observar estrelas", "Razoável para observar estrelas", "Bom para observar estrelas"][stLv] + (stLv && mi.illum > .75 ? " (lua cheia)" : "") });
  const rain48 = sum("precipitation", 0, 48), pp48 = mx("precipitation_probability", 0, 48);
  const carLv = rain48 >= 1 || pp48 >= 60 ? 0 : pp48 >= 35 ? 1 : 2;
  out.push({ ic: "car", lv: carLv, t: ["Não compensa lavar o carro", "Lavar o carro: talvez", "Bom para lavar o carro"][carLv] });
  const lLv = ppNext(8) >= 50 || c.relative_humidity_2m > 90 ? 0 : (ppNext(8) >= 25 || c.relative_humidity_2m > 75 || w < 3) ? 1 : 2;
  out.push({ ic: "laundry", lv: lLv, t: ["Mau para estender roupa", "Roupa seca devagar", "Bom para estender roupa"][lLv] });
  const fLv = g > 65 || kindOf(c.weather_code) === "storm" || (H.visibility[idx] ?? 1e5) < 800 || kindOf(c.weather_code) === "snow" ? 0 : (g > 45 || kindOf(c.weather_code) === "heavy" || (H.visibility[idx] ?? 1e5) < 3000) ? 1 : 2;
  out.push({ ic: "plane", lv: fLv, t: ["Probabilidade alta de atrasos de voo", "Probabilidade moderada de atrasos de voo", "Probabilidade baixa de atrasos de voo"][fLv] });
  const tmax = D.temperature_2m_max[0] ?? t, uvm = D.uv_index_max[0] ?? 0;
  const bLv = tmax >= 25 && (D.precipitation_probability_max[0] ?? 0) < 25 && w < 25 ? 2 : tmax >= 21 && (D.precipitation_probability_max[0] ?? 0) < 40 ? 1 : 0;
  out.push({ ic: "beach", lv: bLv, t: ["Dia pouco indicado para praia", "Praia possível, sem grande calor", "Bom dia de praia" + (uvm >= 6 ? " (protetor!)" : "")][bLv] });
  return out;
}

$("#results").addEventListener("click", e => {
  const f = favs();
  const del = e.target.closest("[data-del]");
  if(del){ e.stopPropagation(); const i = +del.dataset.del; const name = f[i].name; f.splice(i, 1); store.set("ceu.favs", f);
    if(state.sel === i){ state.sel = cfg.showGps || !f.length ? -1 : 0; refresh(false); } else if(state.sel > i) state.sel--;
    store.set("ceu.sel", state.sel); toast(`${name} removido`); renderResults(null); renderHeader(); return; }
  const up = e.target.closest("[data-up]");
  if(up){ e.stopPropagation(); const i = +up.dataset.up; [f[i - 1], f[i]] = [f[i], f[i - 1]]; store.set("ceu.favs", f);
    if(state.sel === i) state.sel = i - 1; else if(state.sel === i - 1) state.sel = i; store.set("ceu.sel", state.sel); renderResults(null); renderHeader(); return; }
  const it = e.target.closest(".item"); if(!it) return;
  if(it.dataset.sel != null){ closeSheets(); go(+it.dataset.sel); return; }
  if(it.dataset.res != null){
    const r = $("#results")._items[+it.dataset.res];
    let i = f.findIndex(x => sameP(x, r));
    if(i < 0){ f.push({ lat: r.lat, lon: r.lon, name: r.name, region: r.region, country: r.country, cc: r.cc }); store.set("ceu.favs", f); i = f.length - 1; toast(`${r.name} adicionado`); fetchListNow(); }
    $("#q").value = ""; closeSheets(); state.sel = -2; go(i);
  }
});
$("#cityBtn").addEventListener("click", () => { $("#q").value = ""; renderResults(null); openSheet("#searchSheet"); fetchListNow(); });
$("#ttl").addEventListener("click", () => $("#cityBtn").click());

/* deslizar entre locais */
(() => {
  let x0 = null, y0 = null;
  const hero = $("#hero");
  hero.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  hero.addEventListener("touchend", e => {
    if(x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dy) < 50) go(state.sel + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();

/* ---------- definições ---------- */

  US: "Estados Unidos", CA: "Canadá", MX: "México", GT: "Guatemala", CR: "Costa Rica", PA: "Panamá", CU: "Cuba", PR: "Porto Rico", NI: "Nicarágua", AR: "Argentina", CL: "Chile", PE: "Peru", BO: "Bolívia", CO: "Colômbia", EC: "Equador", VE: "Venezuela", UY: "Uruguai", PY: "Paraguai",
  JP: "Japão", CN: "China", HK: "Hong Kong", TW: "Taiwan", KR: "Coreia do Sul", IN: "Índia", NP: "Nepal", LK: "Sri Lanka", TH: "Tailândia", VN: "Vietname", KH: "Camboja", MY: "Malásia", SG: "Singapura", ID: "Indonésia", PH: "Filipinas", MM: "Myanmar", PK: "Paquistão",
  AE: "Emirados Árabes Unidos", QA: "Catar", SA: "Arábia Saudita", IL: "Israel", JO: "Jordânia", IR: "Irão", UZ: "Uzbequistão", KZ: "Cazaquistão", AM: "Arménia", AZ: "Azerbaijão",
  EG: "Egito", MA: "Marrocos", TN: "Tunísia", ZA: "África do Sul", TZ: "Tanzânia", KE: "Quénia", ZW: "Zimbabué", GH: "Gana", ML: "Mali", MG: "Madagáscar", NA: "Namíbia", DZ: "Argélia", ET: "Etiópia",
  AU: "Austrália", NZ: "Nova Zelândia", FJ: "Fiji", PF: "Polinésia Francesa" };
function monOptions(){ const L = Sky.list(), by = {}; L.forEach(m => (by[m.cc] = by[m.cc] || []).push(m)); const top = ["PT", "BR", "DE", "PL"];
  return Object.keys(by).sort((a, b) => (top.indexOf(a) + 1 || 99) - (top.indexOf(b) + 1 || 99) || (CCN[a] || a).localeCompare(CCN[b] || b)).map(cc => `<optgroup label="${esc(CCN[cc] || cc)}">${by[cc].sort((a, b) => a.city.localeCompare(b.city)).map(m => `<option value="${m.id}"${cfg.monument === m.id ? " selected" : ""}>${esc(m.city)} · ${esc(m.name)}</option>`).join("")}</optgroup>`).join(""); }
const SCENES = [["monument", "Monumentos do país"], ["lake", "Lago e montanhas"], ["sea", "Mar e farol"], ["city", "Cidade junto ao rio"], ["field", "Campo com moinho"], ["village", "Aldeia na serra"], ["gothic", "Gótico (Tim Burton)"], ["sky", "Só céu"]];
const seg = (key, opts, val) => `<div class="seg" data-k="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(v) === String(val) ? "on" : ""}">${l}</button>`).join("")}</div>`;
function fmtWhen(ts){ if(!ts) return "nunca"; const d = new Date(ts), now = new Date(); const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  return d.toDateString() === now.toDateString() ? `hoje às ${hm}` : `${d.getDate()} ${MON[d.getMonth()]} às ${hm}`; }
function renderSettings(){
  const f = favs();
  const wopts = [`<option value="gps"${cfg.wplace === "gps" ? " selected" : ""}>Minha localização</option>`].concat(f.map(p => `<option value="${pkey(p)}"${cfg.wplace === pkey(p) ? " selected" : ""}>${esc(p.name)}</option>`)).join("");
  $("#setBody").innerHTML = `
    <div class="set-sec">Fonte da previsão</div>
    ${SOURCES.map(x => `<div class="opt ${x.id === state.source ? "sel" : ""}" data-src="${x.id}"><span class="rd"></span><div><b>${x.name}</b><small>${x.desc}</small></div></div>`).join("")}

    <div class="set-sec">Sincronização</div>
    <div class="set-row"><div>No app<small>Atualiza sozinho enquanto está aberto e ao voltar a ele</small></div>${seg("sync", [[15, "15 min"], [30, "30 min"], [60, "1 h"], [0, "Manual"]], cfg.sync)}</div>
    <div class="set-row"><div>Widgets<small>Frequência no ecrã inicial</small></div>${seg("wsync", [[30, "30 min"], [60, "1 h"], [120, "2 h"], [180, "3 h"]], cfg.wsync)}</div>
    <div class="set-row"><div>Última sincronização<small>${fmtWhen(store.get("ceu.lastSync"))}</small></div><button class="seg" id="syncNow" style="padding:7px 12px;font-size:12.5px;color:var(--txt)">Sincronizar agora</button></div>

    <div class="set-sec">Locais</div>
    <div class="set-row"><div>Usar a minha localização (GPS)<small>Mostra o local onde estás como primeiro local</small></div>${seg("showGps", [[1, "Sim"], [0, "Não"]], cfg.showGps ? 1 : 0)}</div>
    <div class="set-row"><div>Precisão do GPS<small>Alta é mais exata mas gasta mais bateria</small></div>${seg("hiAcc", [[0, "Normal"], [1, "Alta"]], cfg.hiAcc ? 1 : 0)}</div>
    <div class="set-row"><div>Local dos widgets</div><select class="sel" id="wplace">${wopts}</select></div>

    <div class="set-sec">Unidades</div>
    <div class="set-row"><div>Temperatura</div>${seg("u.t", [["c", "°C"], ["f", "°F"]], cfg.units.t)}</div>
    <div class="set-row"><div>Vento</div>${seg("u.w", [["kmh", "km/h"], ["ms", "m/s"], ["mph", "mph"], ["kn", "nós"]], cfg.units.w)}</div>
    <div class="set-row"><div>Precipitação</div>${seg("u.p", [["mm", "mm"], ["in", "pol"]], cfg.units.p)}</div>
    <div class="set-row"><div>Pressão</div>${seg("u.pr", [["hpa", "hPa"], ["mmhg", "mmHg"], ["inhg", "inHg"]], cfg.units.pr)}</div>

    <div class="set-sec">Aparência</div>
    <div class="set-row"><div>Design do app</div>${seg("design", [["classic", "Clássico"], ["glass", "Liquid Glass"]], cfg.design)}</div>
    <div class="set-row"><div>Estilo dos widgets<small>Toca em ↻ no widget para aplicar já</small></div>${seg("wstyle", [["classic", "Clássico"], ["glass", "Vidro"]], cfg.wstyle)}</div>
    <div class="set-row"><div>Posição da temperatura</div>${seg("layout", [["corner", "Canto"], ["center", "Centro"]], cfg.layout)}</div>
    <div class="set-row"><div>Cena de fundo<small>Muda com o tempo, a hora e a estação</small></div><select class="sel" id="sceneSel">${SCENES.map(([v, l]) => `<option value="${v}"${cfg.scene === v ? " selected" : ""}>${l}</option>`).join("")}</select></div>
    ${cfg.scene === "monument" ? `<div class="set-row"><div>Monumento<small>Automático: o mais perto de ti no país onde estás</small></div><select class="sel" id="monSel"><option value="auto">Automático</option>${monOptions()}</select></div>` : ""}
    <div class="set-row"><div>Pessoa na paisagem<small>Veste-se conforme o tempo</small></div>${seg("person", [[1, "Sim"], [0, "Não"]], cfg.person ? 1 : 0)}</div>
    <div class="set-row"><div>Animação do fundo<small>Estático ou desligado poupa bateria</small></div>${seg("anim", [["on", "Animado"], ["static", "Estático"], ["off", "Desligado"]], cfg.anim)}</div>
    <div class="set-row" style="display:block"><div style="margin-bottom:10px">Cartões visíveis<small>Toca para mostrar ou esconder</small></div>
      <div class="chips2" id="cardChips">${CARDS.map(([k, l]) => `<button data-card="${k}" class="${cfg.hidden.includes(k) ? "" : "on"}">${l}</button>`).join("")}</div></div>

    <div class="set-sec">Dados</div>
    <button class="btn" id="clearCache">Limpar dados em cache</button>
    <button class="btn danger" id="resetAll">Repor todas as definições</button>
    <p class="txt">Céu · previsão Open-Meteo (ECMWF, DWD, NOAA, Météo-France), avisos IPMA, mapa Windy, localização BigDataCloud / OpenStreetMap. A probabilidade de chuva vem dos <i>ensembles</i> do ECMWF, ICON e GFS.</p>`;
}
$("#setBtn").addEventListener("click", () => { renderSettings(); openSheet("#setSheet"); });
$("#setBody").addEventListener("click", e => {
  const o = e.target.closest("[data-src]");
  if(o){ if(o.dataset.src === state.source) return; state.source = o.dataset.src; store.set("ceu.source", state.source); state.pc = {}; renderSettings(); saveWidget(); refresh(); return; }
  const b = e.target.closest(".seg[data-k] button");
  if(b){
    const k = b.closest(".seg").dataset.k, v = b.dataset.v;
    if(k.startsWith("u.")) cfg.units[k.slice(2)] = v;
    else if(k === "sync" || k === "wsync") cfg[k] = +v;
    else if(k === "showGps" || k === "hiAcc" || k === "person") cfg[k] = v === "1";
    else cfg[k] = v;
    saveCfg(); renderSettings();
    if(k === "showGps"){ if(!cfg.showGps && state.sel < 0 && favs().length){ state.sel = 0; refresh(false); } renderHeader(); }
    if(k === "wsync" || k === "u.t" || k === "wstyle") saveWidget();
    if(k === "design" || k === "layout") applyDesign();
    if(k === "sync") setupSync();
    if(state.data) renderAll();
    return;
  }
  const c = e.target.closest("[data-card]");
  if(c){ const k = c.dataset.card; cfg.hidden = cfg.hidden.includes(k) ? cfg.hidden.filter(x => x !== k) : [...cfg.hidden, k]; saveCfg(); c.classList.toggle("on"); if(state.data) renderAll(); return; }
  if(e.target.closest("#syncNow")){ toast("A sincronizar…"); refresh(true).then(() => { saveWidget(); renderSettings(); }); return; }
  if(e.target.closest("#clearCache")){ state.pc = {}; ["ceu.cache", "ceu.ipmaD"].forEach(k => store.set(k, null)); toast("Cache limpa"); refresh(true); return; }
  if(e.target.closest("#resetAll")){ Object.assign(cfg, JSON.parse(JSON.stringify(CFG0))); saveCfg(); applyDesign(); state.source = "auto"; store.set("ceu.source", "auto"); renderSettings(); setupSync(); saveWidget(); if(state.data) renderAll(); toast("Definições repostas"); }
});
$("#setBody").addEventListener("change", e => { if(e.target.id === "sceneSel"){ cfg.scene = e.target.value; saveCfg(); renderSettings(); if(state.data) renderAll(); return; } if(e.target.id === "monSel"){ cfg.monument = e.target.value; saveCfg(); if(state.data) renderAll(); return; } if(e.target.id === "wplace"){ cfg.wplace = e.target.value; saveCfg(); saveWidget(); toast("Local dos widgets atualizado"); } });

/* ---------- puxar para atualizar ---------- */
(() => {
  const ptr = $("#ptr"); let y0 = null;
  addEventListener("touchstart", e => { y0 = (scrollY <= 0 && !document.querySelector(".sheet.open")) ? e.touches[0].clientY : null; }, { passive: true });
  addEventListener("touchmove", e => { if(y0 == null) return; const dy = e.touches[0].clientY - y0; if(dy <= 0) return;
    ptr.style.opacity = Math.min(1, dy / 80); ptr.style.transform = `translateY(${Math.min(dy * .5, 90)}px)`; ptr.classList.toggle("ready", dy > 150); }, { passive: true });
  addEventListener("touchend", () => { if(y0 == null) return; const go = ptr.classList.contains("ready"); y0 = null;
    ptr.classList.remove("ready"); if(go){ ptr.classList.add("spin"); ptr.style.transform = "translateY(70px)"; refresh().finally(() => { ptr.classList.remove("spin"); ptr.style.transform = ""; ptr.style.opacity = 0; }); }
    else { ptr.style.transform = ""; ptr.style.opacity = 0; } });
})();

/* ---------- arranque ---------- */
function applyDesign(){ document.body.classList.toggle("glass", cfg.design === "glass"); document.body.classList.toggle("corner", cfg.layout === "corner"); }
applyDesign();
let syncT = 0;
function setupSync(){
  clearInterval(syncT);
  if(!cfg.sync) return;
  syncT = setInterval(() => { if(document.visibilityState === "visible" && state.data && Date.now() - state.data.ts > cfg.sync * 60000) refresh(true); }, 60000);
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && cfg.sync && state.data && Date.now() - state.data.ts > cfg.sync * 60000) refresh(true);
});
(async function init(){
  const cache = store.get("ceu.cache");
  if(cache && cache.data && cache.data.fc){ state.place = cache.place; state.data = cache.data; state.pc[pkey(cache.place)] = cache.data; try{ renderAll(); }catch(e){ console.error(e); } }
  setupSync();
  await refresh(true);
  saveWidget();
})();
</script>
</body>
</html>
