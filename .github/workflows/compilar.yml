name: Compilar apps (Android e Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar SDK e NDK (usa o SDK que já vem na máquina do GitHub)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Número da versão (0.1.N, sobe a cada compilação)
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,1))"
          grep '"version"' src-tauri/tauri.conf.json
      - name: Instalar dependências
        run: npm install
      - name: Gerar projeto Android
        run: npx tauri android init --ci
      - name: Ícones do app
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Permissões (localização e internet)
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          for P in INTERNET ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            grep -q "android.permission.$P\"" "$M" || perl -0pi -e "s#(<manifest[^>]*>)#\$1\n    <uses-permission android:name=\"android.permission.$P\" />#" "$M"
          done
          grep -n "uses-permission" "$M"
      - name: Widgets do ecrã inicial
        run: |
          python3 - <<'PY'
          import glob, os, re, shutil
          G = "src-tauri/gen/android/app/src/main"
          ma = glob.glob(G + "/java/**/MainActivity.kt", recursive=True)[0]
          pkg = re.search(r"^package\s+([\w.]+)", open(ma).read(), re.M).group(1)
          src = open("android-widget/CeuWidgets.kt").read()
          src = re.sub(r"^package\s+[\w.]+", "package " + pkg, src, count=1, flags=re.M)
          open(os.path.join(os.path.dirname(ma), "CeuWidgets.kt"), "w").write(src)
          for sub in ("layout", "xml", "drawable"):
              os.makedirs(f"{G}/res/{sub}", exist_ok=True)
              for f in glob.glob(f"android-widget/res/{sub}/*.xml"):
                  shutil.copy(f, f"{G}/res/{sub}/")
          rec = ""
          for cls, info, label in (("CeuWidgetSmall", "ceu_widget_small_info", "Céu · Agora"),
                                   ("CeuWidgetHours", "ceu_widget_hours_info", "Céu · Próximas horas"),
                                   ("CeuWidgetDays", "ceu_widget_days_info", "Céu · Próximos dias")):
              rec += f"""
                  <receiver android:name="{pkg}.{cls}" android:exported="false" android:label="{label}">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/{info}" />
                  </receiver>"""
          m = G + "/AndroidManifest.xml"
          x = open(m).read()
          if "CeuWidgetSmall" not in x:
              x = x.replace("</application>", rec + "\n    </application>", 1)
          open(m, "w").write(x)
          print("pacote:", pkg); print(x)
          PY
      - name: Compilar APK otimizado
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: Assinar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "APK: $IN"
          "$BT/zipalign" -p -f 4 "$IN" alinhado.apk
          "$BT/apksigner" sign --ks android-assinatura/ceu-teste.jks --ks-key-alias ceu --ks-pass pass:ceu-teste --key-pass pass:ceu-teste --out Ceu-Android.apk alinhado.apk
          "$BT/apksigner" verify Ceu-Android.apk && ls -la Ceu-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ceu-Android
          path: Ceu-Android.apk
          if-no-files-found: error

  windows:
    name: Windows (instalador .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Número da versão (0.1.N, sobe a cada compilação)
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,1))"
      - name: Instalar dependências
        run: npm install
      - name: Ícones do app
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Compilar
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Ceu-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publicar:
    name: Publicar em Releases
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
      - name: Organizar arquivos
        run: |
          mkdir -p saida
          find arquivos -name "*.apk" | head -1 | xargs -I{} cp {} "saida/Ceu-Android.apk"
          find arquivos -name "*-setup.exe" | head -1 | xargs -I{} cp {} "saida/Ceu-Windows-instalador.exe"
          ls -la saida
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Céu 0.1.${{ github.run_number }}
          body: |
            Versão 0.1.${{ github.run_number }} (commit ${{ github.sha }}).
            - **Android:** `Ceu-Android.apk` — no Obtainium, use o endereço do repositório para receber as atualizações sozinho.
            - **Windows:** `Ceu-Windows-instalador.exe`.
            Links fixos (sempre a versão mais nova):
            - https://github.com/${{ github.repository }}/releases/latest/download/Ceu-Android.apk
            - https://github.com/${{ github.repository }}/releases/latest/download/Ceu-Windows-instalador.exe
          prerelease: false
          make_latest: true
          files: saida/*
      - name: Apagar versões antigas (fica só a mais nova)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=v0.1.${{ github.run_number }}
          gh release list --repo ${{ github.repository }} --limit 200 --json tagName -q '.[].tagName' | while read -r T; do
            if [ "$T" != "$KEEP" ]; then echo "apagando $T"; gh release delete "$T" --repo ${{ github.repository }} --cleanup-tag -y || true; fi
          done
